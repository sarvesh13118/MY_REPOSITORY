<html lang="en">
  <head>
    <title>Web Page with iFrame</title>
  </head>
  <body>
    <h1>Welcome to My Web Page</h1>
    <p>
      This is an example of using an <code>iframe</code> to embed another web
      page:
    </p>
    <iframe
      src="https://www.example.com"
      width="600"
      height="400"
      style="border: 1px solid black"
    >
    </iframe>
    <p>
      Note: The content displayed within the iframe depends on the embedded
      website's permissions.
    </p>
  </body>
</html>
