<!DOCTYPE html>
<html>
<head>
    <title>Frameset Example</title>
</head>
<frameset cols="30%, 70%">
    <frameset rows="50%, 50%">
        <frame src="frame1.html" name="frame1">
        <frame src="frame2.html" name="frame2">
    </frameset>
    <frameset cols="50%, 50%">
            <frame src="frame3.html" name="frame3">
            <frame src="frame4.html" name="frame4">
        </frameset>
    </frameset>
</frameset>
</html>
