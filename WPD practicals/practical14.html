<!DOCTYPE html>
<html>
  <head>
    <title>Background and Foreground Image Example</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-image: url("https://via.placeholder.com/1920x1080");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: white;
        text-align: center;
      }
      .content {
        background-color: rgba(0, 0, 0, 0.5);
        padding: 20px;
        margin: 50px auto;
        width: 80%;
        border-radius: 10px;
      }
      .foreground-image {
        width: 300px;
        height: auto;
        border: 5px solid white;
        border-radius: 10px;
        margin-top: 20px;
      }
      h1 {
        font-size: 2.5em;
      }
      p {
        font-size: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>Welcome to My Web Page</h1>
      <p>
        This is an example of a webpage with a background image and a foreground
        image.
      </p>
      <p>You can add more content here, such as text, images, or links.</p>
      <img
        class="foreground-image"
        src="https://via.placeholder.com/300"
        alt="Foreground Image"
      />
    </div>
  </body>
</html>
