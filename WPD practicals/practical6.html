<html>
  <head>
    <title>Border Styles Example</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h1 {
        text-align: center;
        color: darkblue;
      }
      .solid-border {
        border: 2px solid black;
        padding: 10px;
        margin: 10px 0;
      }
      .dotted-border {
        border: 2px dotted red;
        padding: 10px;
        margin: 10px 0;
      }
      .dashed-border {
        border: 2px dashed green;
        padding: 10px;
        margin: 10px 0;
      }
      .double-border {
        border: 4px double blue;
        padding: 10px;
        margin: 10px 0;
      }
      .groove-border {
        border: 4px groove gray;
        padding: 10px;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>Border Styles Example</h1>

    <p class="solid-border">
      This paragraph has a <strong>solid</strong> border style.
    </p>

    <p class="dotted-border">
      This paragraph has a <strong>dotted</strong> border style.
    </p>

    <p class="dashed-border">
      This paragraph has a <strong>dashed</strong> border style.
    </p>

    <p class="double-border">
      This paragraph has a <strong>double</strong> border style.
    </p>

    <p class="groove-border">
      This paragraph has a <strong>groove</strong> border style.
    </p>
  </body>
</html>
