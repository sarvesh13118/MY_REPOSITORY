<html>
  <head>
    <title>External Links with Styling</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        text-align: center;
      }
      h1 {
        color: darkblue;
      }
      a.google-link {
        color: green;
        text-decoration: none;
      }
      a.google-link:hover {
        color: red;
        text-decoration: underline;
      }
      a.google-link:visited {
        color: purple;
      }
      a.email-link {
        color: blue;
        text-decoration: none;
      }
      a.email-link:hover {
        color: orange;
        text-decoration: underline;
      }
      a.email-link:visited {
        color: pink;
      }
    </style>
  </head>
  <body>
    <h1>External Links with Styling</h1>

    <p>Click the link below to visit Google:</p>
    <p>
      <a class="google-link" href="https://www.google.com" target="_blank"
        >Go to Google</a
      >
    </p>

    <p>Click the link below to send an email to Sarvesh Joshi:</p>
    <p>
      <a class="email-link" href="mailto:sarveshjoshi369@gmail.com"
        >Send Email to Sarvesh Joshi</a
      >
    </p>
  </body>
</html>
