<html lang="en">
  <head>
    <title>Background Image Example</title>
    <style>
      body {
        background-image: url("background-page.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
      }
      p {
        background-image: url("background-paragraph.jpg");
        background-size: cover;
        background-position: center;
        color: white;
        padding: 20px;
        border-radius: 10px;
        width: 50%;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to My Page</h1>
    <p>This is a paragraph with a background image.</p>
  </body>
</html>
