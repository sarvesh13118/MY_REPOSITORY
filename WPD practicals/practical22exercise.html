<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Demonstration</title>

    <link rel="stylesheet" href="styles.css" />

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f4f4f4;
      }
      .internal-style {
        color: blue;
        font-size: 20px;
        padding: 10px;
        border: 2px solid blue;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <h1 style="color: green; text-decoration: underline">
      Inline Style Example
    </h1>

    <p class="internal-style">This paragraph is styled using Internal CSS.</p>

    <p class="external-style">This paragraph is styled using External CSS.</p>
  </body>
</html>
