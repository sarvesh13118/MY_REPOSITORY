<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu - Zomato Clone</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Restaurant Menu</h1>
      <a href="cart.html">🛒 View Cart</a>
    </header>

    <section class="menu-list">
      <div class="menu-item">
        <img src="images/pizza.jpg" alt="Pizza" />
        <h2>Pizza</h2>
        <p>₹299</p>
        <button onclick="addToCart('Pizza', 299)">Add to Cart</button>
      </div>

      <div class="menu-item">
        <img src="images/burger.jpg" alt="Burger" />
        <h2>Burger</h2>
        <p>₹199</p>
        <button onclick="addToCart('Burger', 199)">Add to Cart</button>
      </div>
      <div class="we_offer__cards">
        <a href="menu.html">
          <img src="./Images/item1.png" alt="Order Online" />
          <div class="we_offer__cards_content">
            <h2>Order Online</h2>
            <p>Stay home and order to your doorstep</p>
          </div>
        </a>
      </div>
    </section>
  </body>
</html>
