<html>
  <head>
    <title>Mathematical Symbols</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      table {
        margin: 0 auto;
        border-collapse: collapse;
        width: 50%;
      }
      th,
      td {
        border: 1px solid black;
        padding: 10px;
      }
      th {
        background-color: lightgray;
      }
    </style>
  </head>
  <body>
    <h1>Mathematical Symbols</h1>
    <table>
      <tr>
        <th>Symbol</th>
        <th>Description</th>
        <th>HTML Code</th>
      </tr>
      <tr>
        <td>&plus;</td>
        <td>Addition</td>
        <td>&amp;plus;</td>
      </tr>
      <tr>
        <td>&minus;</td>
        <td>Subtraction</td>
        <td>&amp;minus;</td>
      </tr>
      <tr>
        <td>&times;</td>
        <td>Multiplication</td>
        <td>&amp;times;</td>
      </tr>
      <tr>
        <td>&divide;</td>
        <td>Division</td>
        <td>&amp;divide;</td>
      </tr>
      <tr>
        <td>&radic;</td>
        <td>Square Root</td>
        <td>&amp;radic;</td>
      </tr>
    </table>
  </body>
</html>
