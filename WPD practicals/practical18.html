<html lang="en">
  <head>
    <title>Animal and Bird Table</title>
    <style>
      table {
        width: 50%;
        border-collapse: collapse;
        text-align: center;
      }
      th,
      td {
        border: 1px solid black;
        padding: 10px;
      }
      img {
        width: 50px;
        height: 50px;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <th>Name</th>
        <th>Image</th>
        <th>Category</th>
      </tr>
      <tr>
        <td>Tiger</td>
        <td><img src="tiger.jpg" alt="Tiger" /></td>
        <td>Animal</td>
      </tr>
      <tr>
        <td>Eagle</td>
        <td><img src="eagle.jpg" alt="Eagle" /></td>
        <td>Bird</td>
      </tr>
      <tr>
        <td>Rabbit</td>
        <td><img src="rabbit.jpg" alt="Rabbit" /></td>
        <td>Animal</td>
      </tr>
      <tr>
        <td>Parrot</td>
        <td><img src="parrot.jpg" alt="Parrot" /></td>
        <td>Bird</td>
      </tr>
    </table>
  </body>
</html>
