<html>
  <head>
    <title>Styled Headings</title>
    <style>
      h1 {
        background-color: rgb(125, 221, 101);
        color: white;
      }
      h2 {
        background-color: green;
        color: yellow;
      }
    </style>
  </head>
  <body>
    <h1>This is an H1 Heading</h1>
    <h2>This is an H2 Heading</h2>
  </body>
</html>
